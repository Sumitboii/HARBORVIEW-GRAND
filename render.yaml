services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: harborview-grand-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GEMINI_LLM_MODEL
        value: models/gemini-2.0-flash
      - key: ALLOWED_ORIGIN
        value: https://harborview-grand.onrender.com

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  - type: web
    name: harborview-grand
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://harborview-grand-api.onrender.com
