services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: harborview-grand-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LLM_MODEL
        value: models/gemini-2.0-flash
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: harborview-grand
          property: url

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  - type: web
    name: harborview-grand
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: harborview-grand-api
          property: url
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
